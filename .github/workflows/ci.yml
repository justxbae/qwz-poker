name: CI

on:
  push:
    branches: [main, staging, codex/cloudflare-production]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Cloudflare development tools
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Cloudflare development tools
        run: npm ci --prefix infra/cloudflare

      - name: Verify Workers runtime and durable restart
        run: npm run test:cloudflare
