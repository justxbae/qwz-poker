services:
  - type: web
    name: qwz-poker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: QWZ Poker
      - key: BOT_USERNAME
        value: qwzpokerbot
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CRYPTO_WEBHOOK_SECRET
        sync: false
      - key: CRYPTOBOT_API_KEY
        sync: false
      - key: CRYPTOBOT_API_BASE
        value: https://pay.crypt.bot/api
      - key: XROCKET_PAY_API_KEY
        sync: false
      - key: XROCKET_PAY_API_BASE
        value: https://pay.xrocket.tg
      - key: XROCKET_WEBHOOK_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: TON_PAYMENTS_ENABLED
        value: "false"
      - key: TON_RECEIVER_ADDRESS
        value: UQB5ZtlMthiWet8Cy0K8LFOJc-5aG55uQc7DCnHA18XiYn9T
      - key: TON_POLLING_ENABLED
        value: "false"
      - key: TONCENTER_API_KEY
        sync: false
      - key: TON_RUB_RATE
        sync: false
      - key: STARS_USDT_RATE
        value: "0.01"
      - key: USDT_TRC20_PAYMENTS_ENABLED
        value: "false"
      - key: USDT_TRC20_RECEIVER_ADDRESS
        sync: false
      - key: USDT_RUB_RATE
        sync: false
      - key: CRYPTO_PROVIDER_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REAL_MONEY_ENABLED
        value: "true"
      - key: MINIMAL_LAUNCH
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
