services:
  - type: web
    name: qwz-poker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: QWZ Poker
      - key: BOT_USERNAME
        value: qwzpokerbot
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
