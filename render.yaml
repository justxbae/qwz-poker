services:
  - type: web
    name: qwz-poker
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: QWZ Poker
      - key: BOT_USERNAME
        value: qwzpokerbot
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CRYPTO_WEBHOOK_SECRET
        sync: false
      - key: TON_PAYMENTS_ENABLED
        value: "false"
      - key: TON_RECEIVER_ADDRESS
        sync: false
      - key: TON_RUB_RATE
        sync: false
      - key: USDT_TRC20_PAYMENTS_ENABLED
        value: "false"
      - key: USDT_TRC20_RECEIVER_ADDRESS
        sync: false
      - key: USDT_RUB_RATE
        sync: false
      - key: CRYPTO_PROVIDER_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
